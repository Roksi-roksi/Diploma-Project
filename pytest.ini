[pytest]
pythonpath = .
testpaths = api_tests ui_tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    api: тесты для проверки бэкенда панели управления YouGile через запросы
    ui: тесты для сквозной проверки интерфейса YouGile через Selenium/WebDriver




